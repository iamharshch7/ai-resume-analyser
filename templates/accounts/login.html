{% extends "base.html" %}

{% block title %}Sign In - ResumeAI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-saas p-4">
                <div class="text-center mb-4">
                    <span class="brand-icon mx-auto mb-2"><i class="bi bi-person"></i></span>
                    <h3 class="fw-bold">Welcome back</h3>
                    <p class="text-muted small">Enter your credentials to access your resume dashboard</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label font-weight-medium">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label font-weight-medium">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Sign In</button>
                </form>
                <div class="text-center mt-4">
                    <span class="text-muted small">Don't have an account? </span>
                    <a href="{% url 'accounts:register' %}" class="small text-primary-custom fw-semibold">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
